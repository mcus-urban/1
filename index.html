<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CƠ SỞ DỮ LIỆU QUẢN LÝ VỀ PHÁT TRIỂN ĐÔ THỊ VÀ ĐÔ THỊ THÔNG MINH</title>
  
  <style>
    /* Reset CSS để xóa khoảng trắng thừa của trình duyệt */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* Ngăn cuộn trang từ bên ngoài */
      background-color: #f4f6f9; 
      font-family: Arial, sans-serif;
    }

    /* Container chứa Web App */
    .app-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh; /* dvh giúp tương thích tốt với thanh địa chỉ của mobile */
      z-index: 1;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <iframe 
      src="https://script.google.com/macros/s/AKfycbzgHCOKUAz8UR_pUSgnHdeG-xj2-vpILAnG0X2LFLtgjNlC3LePHKzo4cDYaVy2_FPl/exec"
      allowfullscreen="true">
    </iframe>
  </div>

</body>
</html>
